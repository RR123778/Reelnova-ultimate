<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelNova AI PRO</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
  margin:0;
}

header{
  background:#ff4081;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

input, textarea{
  width:90%;
  padding:10px;
  margin:10px 0;
  border:none;
  border-radius:8px;
}

button{
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#ff4081;
  color:white;
  cursor:pointer;
}

canvas{
  margin-top:15px;
  border-radius:10px;
  background:black;
}
</style>
</head>

<body>

<header>🔥 ReelNova AI PRO</header>

<div class="container">

<input id="prompt" placeholder="Enter topic...">

<br>

<button onclick="generate()">Generate</button>
<button onclick="playVideo()">Preview</button>
<button onclick="speakAll()">Voice</button>
<button onclick="record()">Record</button>
<button onclick="download()">Download</button>

<br>

<textarea id="script" rows="6" placeholder="Script will appear here..."></textarea>

<canvas id="canvas" width="360" height="640"></canvas>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scenes = [];
let index = 0;

// 🔥 Generate Script
function generate(){
  const prompt = document.getElementById("prompt").value.trim();

  if(!prompt){
    alert("⚠️ Enter topic!");
    return;
  }

  scenes = [
    "🔥 " + prompt,
    "क्या आप जानते हैं " + prompt + "?",
    prompt + " आपके लिए क्यों जरूरी है",
    "Top tips follow करो",
    "Final secret miss मत करना 🔥"
  ];

  document.getElementById("script").value = scenes.join("\n");

  drawScene(scenes[0]);
}

// 🎥 Preview
function playVideo(){
  if(scenes.length === 0){
    alert("Generate first!");
    return;
  }

  index = 0;
  nextScene();
}

function nextScene(){
  if(index >= scenes.length) return;

  drawScene(scenes[index]);

  index++;
  setTimeout(nextScene, 2000);
}

// 🎨 Draw Scene
function drawScene(text){
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,360,640);

  ctx.fillStyle = "white";
  ctx.font = "22px Arial";

  wrapText(text,20,250,300,30);
}

// 📏 Wrap Text
function wrapText(text,x,y,maxWidth,lineHeight){
  let words = text.split(" ");
  let line = "";

  for(let i=0;i<words.length;i++){
    let testLine = line + words[i] + " ";
    let w = ctx.measureText(testLine).width;

    if(w > maxWidth){
      ctx.fillText(line,x,y);
      line = words[i] + " ";
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line,x,y);
}

// 🔊 Voice
function speakAll(){
  if(scenes.length === 0){
    alert("Generate first!");
    return;
  }

  let msg = new SpeechSynthesisUtterance(scenes.join(". "));
  speechSynthesis.speak(msg);
}

// 🎬 Record
let recorder, chunks=[];

function record(){
  if(!canvas.captureStream){
    alert("Recording not supported in your browser");
    return;
  }

  let stream = canvas.captureStream(30);
  recorder = new MediaRecorder(stream);

  chunks = [];

  recorder.ondataavailable = e => chunks.push(e.data);

  recorder.onstop = ()=>{
    let blob = new Blob(chunks,{type:"video/webm"});
    window.videoURL = URL.createObjectURL(blob);
    alert("Recording done!");
  };

  recorder.start();
  playVideo();

  setTimeout(()=>recorder.stop(), scenes.length * 2000);
}

// ⬇ Download
function download(){
  if(!window.videoURL){
    alert("Record first!");
    return;
  }

  let a = document.createElement("a");
  a.href = window.videoURL;
  a.download = "video.webm";
  a.click();
}

</script>

</body>
</html>
