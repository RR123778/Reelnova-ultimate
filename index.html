<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultra PRO AI Reel System</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
  text-align:center;
}
header{
  background:linear-gradient(45deg,#ff4d4d,#22c55e);
  padding:15px;
  font-size:20px;
  font-weight:bold;
}
input, textarea, select{
  width:90%;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:8px;
}
button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:white;
  font-weight:bold;
}
canvas{
  width:90%;
  max-width:360px;
}
</style>
</head>

<body>

<header>🔥 Ultra PRO AI Reel System</header>

<select id="type">
<option value="product">🛒 Product Selling</option>
<option value="motivation">💪 Motivation</option>
<option value="offer">⚡ Offer</option>
<option value="story">📖 Story</option>
<option value="festival">🎉 Festival</option>
<option value="custom">✍️ Custom</option>
</select>

<input id="product" placeholder="Product / Topic">
<input id="price" placeholder="Price / Detail">
<input id="image" placeholder="Image URL">
<input id="phone" placeholder="WhatsApp Number">

<button onclick="generate()">🎬 Generate</button>
<button onclick="play()">▶ Preview</button>
<button onclick="record()">🎥 Record</button>
<button onclick="download()">⬇ Download</button>
<button onclick="voice()">🎤 Voice</button>
<button onclick="share()">📲 WhatsApp Sell</button>

<textarea id="script" rows="6"></textarea>

<canvas id="canvas" width="720" height="1280"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scenes=[], index=0, alpha=0;
let img = new Image();
let bgm = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");

// 🎬 SCRIPT AI
function generate(){

  let t = type.value;
  let p = product.value;
  let pr = price.value;

  if(t=="product"){
    scenes = [
      "🔥 आज का सबसे वायरल प्रोडक्ट!",
      p + " जिसे लोग बार-बार खरीद रहे हैं 😍",
      "सिर्फ ₹" + pr + " में शानदार ऑफर 💥",
      "जल्दी करें स्टॉक खत्म हो रहा है ⚠️",
      "अभी WhatsApp करें 👉 " + phone.value
    ];
  }

  else if(t=="motivation"){
    scenes = [
      "💪 जिंदगी बदलनी है?",
      "तो अभी मेहनत शुरू करो 🔥",
      "कोई साथ दे या ना दे ❌",
      "तुम खुद को आगे बढ़ाओ 🚀",
      "आज से शुरू करो!"
    ];
  }

  else if(t=="offer"){
    scenes = [
      "⚡ धमाकेदार ऑफर!",
      p + " पर भारी छूट 💥",
      "सिर्फ ₹" + pr,
      "आज आखिरी मौका 😱",
      "Order Now 👉 " + phone.value
    ];
  }

  else if(t=="story"){
    scenes = [
      "एक लड़का था...",
      "सब उसे कमजोर समझते थे 😢",
      "लेकिन उसने हार नहीं मानी 💪",
      "आज वही सबसे आगे है 🔥",
      "आप भी कर सकते हैं!"
    ];
  }

  else if(t=="festival"){
    scenes = [
      "🎉 त्योहार स्पेशल ऑफर!",
      p + " आपके परिवार के लिए 🎁",
      "खास कीमत ₹" + pr,
      "खुशियां बांटे ❤️",
      "अभी खरीदें!"
    ];
  }

  else{
    scenes = script.value.split("\n");
  }

  script.value = scenes.join("\n");
  img.src = image.value;
}

// ▶ PLAY
function play(){
  index=0;
  bgm.play();
  next();
}

function next(){
  if(index>=scenes.length) return;
  alpha=0;
  animate(scenes[index]);
  index++;
  setTimeout(next,2500);
}

// 🎥 ANIMATION
function animate(text){
  draw(text);
  if(alpha<1){
    alpha+=0.05;
    requestAnimationFrame(()=>animate(text));
  }
}

function draw(text){

  ctx.clearRect(0,0,720,1280);

  let g = ctx.createLinearGradient(0,0,720,1280);
  g.addColorStop(0,"#000");
  g.addColorStop(1,"#1e293b");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,720,1280);

  ctx.globalAlpha = alpha;

  if(img.src){
    ctx.drawImage(img,110,150,500,350);
  }

  ctx.fillStyle="#fff";
  ctx.font="bold 50px Arial";

  wrap(text,60,650,600,60);

  ctx.globalAlpha = 1;
}

// ✍️ WRAP
function wrap(t,x,y,m,l){
  let w=t.split(" "), line="";
  for(let i=0;i<w.length;i++){
    let test=line+w[i]+" ";
    if(ctx.measureText(test).width>m){
      ctx.fillText(line,x,y);
      line=w[i]+" ";
      y+=l;
    } else line=test;
  }
  ctx.fillText(line,x,y);
}

// 🎤 VOICE
function voice(){
  let msg = new SpeechSynthesisUtterance(scenes.join(" "));
  msg.lang = "hi-IN";
  speechSynthesis.speak(msg);
}

// 🎥 RECORD
let rec, chunks=[], videoURL;

function record(){
  let stream = canvas.captureStream(30);
  rec = new MediaRecorder(stream);
  chunks=[];

  rec.ondataavailable=e=>chunks.push(e.data);

  rec.onstop=()=>{
    let blob=new Blob(chunks,{type:"video/webm"});
    videoURL=URL.createObjectURL(blob);
    alert("वीडियो तैयार!");
  };

  rec.start();
  play();

  setTimeout(()=>rec.stop(), scenes.length*2500);
}

// ⬇ DOWNLOAD
function download(){
  if(!videoURL){
    alert("पहले रिकॉर्ड करें");
    return;
  }
  let a=document.createElement("a");
  a.href=videoURL;
  a.download="reel.mp4";
  a.click();
}

// 📲 WHATSAPP SELL
function share(){
  let caption = script.value + 
  "\n🔥 Best Deal\n#viral #offer #shopping";

  window.open("https://wa.me/?text="+encodeURIComponent(caption));
}
</script>

</body>
</html>
