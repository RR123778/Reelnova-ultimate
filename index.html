<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelNova AI FINAL 💰🤖</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
  text-align:center;
}
header{
  background:linear-gradient(45deg,#6366f1,#22c55e);
  padding:15px;
  font-size:20px;
  font-weight:bold;
}
input, textarea{
  width:90%;
  padding:10px;
  margin:8px;
  border:none;
  border-radius:8px;
}
button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#6366f1;
  color:white;
  font-weight:bold;
}
canvas{
  margin-top:10px;
  width:90%;
  max-width:360px;
}
</style>
</head>

<body>

<header>🔥 ReelNova AI FINAL</header>

<input id="product" placeholder="Product Name">
<input id="price" placeholder="Price ₹">
<input id="image" placeholder="Image URL">
<input id="phone" placeholder="WhatsApp Number">
<input id="apikey" placeholder="(Optional) OpenAI API Key">

<br>

<button onclick="generate()">Generate AI Script</button>
<button onclick="playVideo()">Preview</button>
<button onclick="record()">Record</button>
<button onclick="download()">Download</button>
<button onclick="send()">Sell on WhatsApp</button>

<textarea id="script" rows="6"></textarea>

<canvas id="canvas" width="720" height="1280"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scenes=[], index=0;
let img = new Image();

// 🤖 AI Script Generate
async function generate(){

  let p = product.value;
  let pr = price.value;
  let ph = phone.value;
  let api = apikey.value;

  if(!p || !pr || !ph){
    alert("Fill all fields");
    return;
  }

  // 🔥 REAL AI (if API available)
  if(api){
    try{
      let res = await fetch("https://api.openai.com/v1/chat/completions",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + api
        },
        body:JSON.stringify({
          model:"gpt-4o-mini",
          messages:[{
            role:"user",
            content:`Create 5 short selling lines for ${p} price ${pr} in Hinglish with strong CTA`
          }]
        })
      });

      let data = await res.json();
      scenes = data.choices[0].message.content.split("\n");

    }catch(e){
      alert("API error, switching to smart AI");
      smartAI();
    }
  } else {
    smartAI();
  }

  script.value = scenes.join("\n");

  img.src = image.value;
  img.onload = ()=> drawScene(scenes[0]);
}

// 🧠 Smart Offline AI
function smartAI(){
  scenes = [
    "🔥 " + product.value,
    "क्या आप सस्ता और best product ढूंढ रहे हैं?",
    "अब मिलेगा सिर्फ ₹" + price.value,
    "Limited stock 🚀 जल्दी करें",
    "Order WhatsApp 👉 " + phone.value
  ];
}

// 🎥 Preview
function playVideo(){
  index=0;
  next();
}

function next(){
  if(index>=scenes.length) return;
  drawScene(scenes[index]);
  index++;
  setTimeout(next,2500);
}

// 🎨 Draw
function drawScene(text){

  let g = ctx.createLinearGradient(0,0,720,1280);
  g.addColorStop(0,"#000");
  g.addColorStop(1,"#1e293b");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,720,1280);

  if(img.src){
    ctx.drawImage(img,110,150,500,350);
  }

  ctx.fillStyle="#fff";
  ctx.font="bold 46px Arial";

  wrap(text,60,650,600,60);
}

// 📏 Wrap
function wrap(t,x,y,m,l){
  let w=t.split(" "), line="";
  for(let i=0;i<w.length;i++){
    let test=line+w[i]+" ";
    if(ctx.measureText(test).width>m){
      ctx.fillText(line,x,y);
      line=w[i]+" ";
      y+=l;
    } else line=test;
  }
  ctx.fillText(line,x,y);
}

// 🎬 Record
let rec,chunks=[];
function record(){

  if(!canvas.captureStream){
    alert("Use Chrome Desktop");
    return;
  }

  let stream = canvas.captureStream(30);
  rec = new MediaRecorder(stream);

  chunks=[];

  rec.ondataavailable=e=>chunks.push(e.data);

  rec.onstop=()=>{
    let blob=new Blob(chunks,{type:"video/webm"});
    window.videoURL=URL.createObjectURL(blob);
    alert("Video Ready!");
  };

  rec.start();
  playVideo();

  setTimeout(()=>rec.stop(), scenes.length*2500);
}

// ⬇ Download
function download(){
  if(!videoURL){
    alert("Record first");
    return;
  }
  let a=document.createElement("a");
  a.href=videoURL;
  a.download="reel.webm";
  a.click();
}

// 📲 WhatsApp Sell
function send(){
  let msg = script.value;
  window.open("https://wa.me/?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
