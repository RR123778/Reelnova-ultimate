<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Reel Auto Selling App</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
  text-align:center;
}

header{
  background:linear-gradient(45deg,#6366f1,#22c55e);
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#0f172a;
  padding:15px;
  margin:10px;
  border-radius:15px;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}

input, textarea{
  width:95%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  font-size:15px;
}

button{
  width:90%;
  padding:12px;
  margin:8px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.generate{ background:#6366f1; color:white; }
.preview{ background:#f59e0b; color:black; }
.sell{ background:#22c55e; color:white; }
.voice{ background:#ec4899; color:white; }

canvas{
  width:100%;
  max-width:350px;
  border-radius:15px;
}
</style>
</head>

<body>

<header>🔥 AI Reel Auto Selling App</header>

<div class="container">

  <div class="card">
    <h3>🛍 Product Details</h3>
    <input id="product" placeholder="Product Name">
    <input id="price" placeholder="Price ₹">
    <input id="phone" placeholder="WhatsApp Number (91xxxxxxxxxx)">
  </div>

  <div class="card">
    <h3>🚀 Actions</h3>
    <button class="generate" onclick="generate()">⚡ Generate Script</button>
    <button class="preview" onclick="play()">🎬 Preview</button>
    <button class="sell" onclick="autoSell()">💰 AUTO SELL</button>
    <button class="voice" onclick="voice()">🎤 Voice</button>
  </div>

  <div class="card">
    <h3>🧠 Script</h3>
    <textarea id="script" rows="6"></textarea>
  </div>

  <div class="card">
    <h3>🎥 Preview</h3>
    <canvas id="canvas" width="720" height="1280"></canvas>
  </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scenes = [];
let index = 0;

// 🔥 GENERATE SCRIPT
function generate(){

  let product = document.getElementById("product").value;
  let price = document.getElementById("price").value;
  let phone = document.getElementById("phone").value;

  if(!product || !price || !phone){
    alert("Sab details bharo!");
    return;
  }

  scenes = [
    "🔥 Trending Product!",
    product,
    "Only ₹" + price,
    "Limited Stock ⚠️",
    "Order Now 📲 " + phone
  ];

  document.getElementById("script").value = scenes.join("\n");
}

// 🎬 PREVIEW
function play(){

  if(scenes.length === 0){
    alert("Pehle script generate karo!");
    return;
  }

  index = 0;
  next();
}

function next(){
  if(index >= scenes.length) return;
  draw(scenes[index]);
  index++;
  setTimeout(next, 2000);
}

function draw(text){

  ctx.clearRect(0,0,720,1280);

  let g = ctx.createLinearGradient(0,0,720,1280);
  g.addColorStop(0,"#000");
  g.addColorStop(1,"#1e293b");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,720,1280);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 40px Arial";

  wrapText(text, 50, 600, 620, 50);
}

function wrapText(text, x, y, maxWidth, lineHeight){
  let words = text.split(" ");
  let line = "";

  for(let n = 0; n < words.length; n++){
    let testLine = line + words[n] + " ";
    let testWidth = ctx.measureText(testLine).width;

    if(testWidth > maxWidth){
      ctx.fillText(line, x, y);
      line = words[n] + " ";
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, y);
}

// 🎤 VOICE
function voice(){
  if(scenes.length === 0){
    alert("Script generate karo!");
    return;
  }

  let msg = new SpeechSynthesisUtterance(scenes.join(" "));
  msg.lang = "hi-IN";
  speechSynthesis.speak(msg);
}

// 💰 AUTO SELL
async function autoSell(){

  let product = document.getElementById("product").value;
  let price = document.getElementById("price").value;
  let phone = document.getElementById("phone").value;

  if(!product || !price || !phone){
    alert("Sab details bharna zaroori hai");
    return;
  }

  try{

    let res = await fetch("http://localhost:3000/auto-reel",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ topic: product })
    });

    let data = await res.json();

    if(!data.video){
      alert("Video generate nahi hua");
      return;
    }

    let waLink = `https://wa.me/${phone}?text=${encodeURIComponent("Hi I want to buy " + product)}`;

    let caption = `
🔥 ${product}
💰 ₹${price}
📲 ${waLink}
`;

    window.open(data.video, "_blank");
    window.open("https://wa.me/?text=" + encodeURIComponent(caption), "_blank");

  } catch(err){
    alert("Server error! Backend check karo");
    console.log(err);
  }
}

</script>

</body>
</html>
